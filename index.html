<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Nurse Alert</title>
</head>

<body style="background:#f0f5ff;
             text-align:center;
             font-family:sans-serif;
             padding:30px;">

  <h1 style="color:#2563eb; font-size:32px;">🏥 Nurse Alert</h1>
  <h3>간호사 채용공고 알림</h3>

  <p>
  📍 검색 반경:
  <select id="radius" onchange="saveRadius()">
    <option value="10">10km</option>
    <option value="20" selected>20km</option>
    <option value="30">30km</option>
    <option value="40">40km</option>
  </select>
</p>

<script>
  const radius = document.getElementById("radius");

  radius.value = localStorage.getItem("radius") || "20";

  function saveRadius() {
  const oldRadius = Number(localStorage.getItem("radius") || 20);
  const newRadius = Number(radius.value);

  if (newRadius > oldRadius) {

    // 이전 검색 반경 저장
    localStorage.setItem("oldRadius", oldRadius);

    // 검색 반경을 확장한 시간 저장
    localStorage.setItem("expandedAt", new Date().toISOString());

  } else if (newRadius < oldRadius) {

    localStorage.removeItem("oldRadius");
    localStorage.removeItem("expandedAt");

  }

  localStorage.setItem("radius", newRadius);
}
</script>
  <p>📅 근무조건: 평일 주 2일</p>

  <hr>

  <h2>🔔 신규 채용공고</h2>

  <div id="job-list"></div>

<script>
  // 테스트용 가상 채용공고
  const jobs = [
  { name: "가상 A병원", distance: 8, days: "월/수" },
  { name: "가상 B병원", distance: 18, days: "화/목" },
  { name: "가상 C병원", distance: 25, days: "월/금" },
  { name: "가상 D병원", distance: 35, days: "수/목" },
  { name: "가상 E병원", distance: 12, days: "토/일" },
  { name: "가상 F병원", distance: 15, days: "월/수/금" }
];
  function isWeekdayTwice(days) {
  const workdays = days.split("/");
  const weekdays = ["월", "화", "수", "목", "금"];

  return (
    workdays.length === 2 &&
    workdays[0] !== workdays[1] &&
    workdays.every(day => weekdays.includes(day))
  );
}
  function showJobs() {
    const radius = Number(document.getElementById("radius").value);
    const jobList = document.getElementById("job-list");

    const filteredJobs = jobs.filter(job =>
  job.distance <= radius &&
  isWeekdayTwice(job.days)
);

    jobList.innerHTML = filteredJobs.map(job => `
      <div style="
        background:white;
        padding:15px;
        margin:10px 0;
        border-radius:10px;
        text-align:left;
      ">
        <h3>🏥 ${job.name}</h3>
        <p>📍 집에서 ${job.distance}km</p>
        <p>📅 근무요일: ${job.days}</p>
      </div>
    `).join("");
  }

  document.getElementById("radius").addEventListener("change", showJobs);

  showJobs();
</script>
<div id="expanded-jobs"></div>

<script>
function showExpandedJobs() {
  const current = Number(document.getElementById("radius").value);
  const previous = Number(localStorage.getItem("oldRadius") || current);

  const missedJobs = jobs.filter(job =>
  job.distance > previous &&
  job.distance <= current &&
  isWeekdayTwice(job.days)
);

  const section = document.getElementById("expanded-jobs");

  if (missedJobs.length === 0) {
    section.innerHTML = "";
    return;
  }

  section.innerHTML = `
    <details style="
      background:#fff3cd;
      padding:15px;
      border-radius:12px;
      margin-top:20px;
      text-align:left;
    ">
      <summary>
        📂 검색 범위 확장으로 발견한 공고
        (${missedJobs.length}건)
      </summary>

      ${missedJobs.map(job => `
        <hr>
        <p>🏥 ${job.name}</p>
        <p>📍 ${job.distance}km</p>
        <p>📅 ${job.days}</p>
      `).join("")}
    </details>
  `;
}

document.getElementById("radius")
  .addEventListener("change", showExpandedJobs);

showExpandedJobs();
</script>

<hr>

<h2>☁️ Cloudflare DB 채용공고</h2>

<div id="server-jobs">
  채용공고를 불러오는 중...
</div>

<script>
async function loadServerJobs() {

  const container = document.getElementById("server-jobs");

  try {

    const radius = document.getElementById("radius").value;

const response = await fetch(
  `https://nurse-alert-checker.youn6628.workers.dev/?radius=${radius}`
);

    if (!response.ok) {
      throw new Error("서버 응답 오류: " + response.status);
    }

    const jobs = await response.json();

    container.innerHTML = "";

    if (jobs.length === 0) {
      container.textContent = "저장된 공고가 없습니다.";
      return;
    }

    jobs.forEach(job => {

      const card = document.createElement("div");

      card.style.cssText = `
        background:white;
        padding:15px;
        margin:10px 0;
        border-radius:10px;
        text-align:left;
      `;

      const hospital = document.createElement("h3");
      hospital.textContent = "🏥 " + job.hospital;

      const title = document.createElement("p");
      title.textContent = job.title;

      const schedule = document.createElement("p");
      schedule.textContent = "📅 " + job.schedule_text;

      const link = document.createElement("a");
      link.textContent = "🔗 채용공고 바로가기";

      if (job.url && /^https?:\/\//i.test(job.url)) {
        link.href = job.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }

      card.append(hospital, title, schedule, link);
      container.appendChild(card);

    });
// 검색 범위 확장으로 발견한 DB 공고
const oldRadius = Number(localStorage.getItem("oldRadius"));
const expandedAt = localStorage.getItem("expandedAt");

if (expandedAt && oldRadius > 0) {

  const missedJobs = jobs.filter(job => {

    if (!job.first_seen_at) return false;

    // DB의 최초 발견 시간은 UTC 기준
    const firstSeen = new Date(
      job.first_seen_at.replace(" ", "T") + "Z"
    );

    return (
      job.distance > oldRadius &&
      firstSeen.getTime() < new Date(expandedAt).getTime()
    );

  });

  if (missedJobs.length > 0) {

    const section = document.createElement("details");

    section.style.cssText = `
      background:#fff3cd;
      padding:15px;
      margin-top:20px;
      border-radius:12px;
      text-align:left;
    `;

    const summary = document.createElement("summary");

    summary.textContent =
      `📂 검색 범위 확장으로 발견한 DB 공고 (${missedJobs.length}건)`;

    section.appendChild(summary);

    missedJobs.forEach(job => {

      const p = document.createElement("p");

      p.textContent =
        `🏥 ${job.hospital} / 📍 ${job.distance}km`;

      section.appendChild(p);

      if (job.url && /^https?:\/\//i.test(job.url)) {
        const link = document.createElement("a");
        link.textContent = "🔗 공고 바로가기";
        link.href = job.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        section.appendChild(link);
      }

    });

    container.appendChild(section);

  }
}

  } catch (error) {

    container.textContent =
      "❌ 채용공고를 불러오지 못했습니다: " + error.message;

  }

}

loadServerJobs();

document.getElementById("radius")
  .addEventListener("change", loadServerJobs);

</script>
<hr>

<h2>🔔 알림 설정</h2>

<button id="enable-notifications"
  style="padding:15px; font-size:18px;
         background:#2563eb; color:white;
         border:0; border-radius:10px;">
  알림 허용하기
</button>

<p id="notification-status"></p>

<script>
const notificationStatus =
  document.getElementById("notification-status");

// 알림 처리 파일 등록
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .catch(error => {
      notificationStatus.textContent =
        "❌ 알림 파일 등록 실패: " + error.message;
    });
}

// 알림 권한 요청
document.getElementById("enable-notifications")
  .addEventListener("click", async () => {

    if (!("Notification" in window) ||
        !("serviceWorker" in navigator)) {
      notificationStatus.textContent =
        "❌ 이 브라우저에서는 알림을 지원하지 않습니다.";
      return;
    }

    const permission = await Notification.requestPermission();

    if (permission === "granted") {
      notificationStatus.textContent =
        "✅ 알림 권한이 허용되었습니다!";
    } else {
      notificationStatus.textContent =
        "⚠️ 알림 권한이 허용되지 않았습니다.";
    }

  });
</script>

<hr>

<h2>🧪 알림 테스트</h2>

<button id="test-notification"
  style="padding:15px; font-size:18px;
         background:#16a34a; color:white;
         border:0; border-radius:10px;">
  🔔 테스트 알림 보내기
</button>

<p id="test-status"></p>

<script>
document.getElementById("test-notification")
  .addEventListener("click", async () => {

    const status = document.getElementById("test-status");

    try {
      if (Notification.permission !== "granted") {
        status.textContent = "❌ 알림 권한이 필요합니다.";
        return;
      }

      const registration = await navigator.serviceWorker.ready;

      await registration.showNotification("🏥 Nurse Alert", {
        body: "새로운 간호사 채용공고 발견!\n📍 12.5km\n📅 평일 주 2일",
        icon: "./favicon.ico",
        data: {
          url: window.location.href
        }
      });

      status.textContent = "✅ 테스트 알림 전송 성공!";

    } catch (error) {
      status.textContent = "❌ 오류: " + error.message;
    }

  });
</script>
  <hr>

<h2>📱 푸시 알림 기기 등록</h2>

<button id="register-push"
  style="padding:15px; font-size:18px;
         background:#2563eb; color:white;
         border:0; border-radius:10px;">
  📱 이 휴대폰 등록하기
</button>

<p id="push-status"></p>

<script>

// 공개키를 브라우저가 사용하는 형식으로 변환
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);

  const base64 = (base64String + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const rawData = atob(base64);

  return Uint8Array.from(
    rawData,
    char => char.charCodeAt(0)
  );
}

// 휴대폰 푸시 알림 구독
document.getElementById("register-push")
  .addEventListener("click", async () => {

    const status = document.getElementById("push-status");

    status.textContent = "⏳ 휴대폰 등록 준비 중...";

    try {

      if (!("serviceWorker" in navigator) ||
          !("PushManager" in window)) {
        throw new Error("이 브라우저는 웹 푸시를 지원하지 않습니다.");
      }

      if (Notification.permission !== "granted") {
        throw new Error("먼저 알림 권한을 허용해 주세요.");
      }

      // Cloudflare에서 공개키 가져오기
      const response = await fetch(
        "https://nurse-alert-checker.youn6628.workers.dev/push/public-key"
      );

      if (!response.ok) {
        throw new Error("공개키를 가져오지 못했습니다.");
      }

      const data = await response.json();

      // Service Worker 준비
      const registration = await navigator.serviceWorker.ready;

      // 기존 구독 확인
      let subscription = await registration.pushManager.getSubscription();

      // 구독이 없다면 새로 생성
      if (!subscription) {

        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(data.publicKey)
        });

      }

      if (subscription) {
        status.textContent =
          "✅ 휴대폰 푸시 구독 생성 성공!";
      }

    } catch (error) {

      status.textContent =
        "❌ 등록 실패: " + error.message;

    }

  });

</script>
  <hr>

<h2>📱 알림 수신 기기 등록</h2>

<input
  type="password"
  id="register-code"
  placeholder="등록용 비밀번호"
  style="padding:12px; border-radius:8px;"
>

<br><br>

<button id="save-push"
  style="padding:15px; background:#2563eb;
         color:white; border:0; border-radius:10px;">
  📱 서버에 휴대폰 등록하기
</button>

<p id="save-push-status"></p>

<script>
document.getElementById("save-push")
  .addEventListener("click", async () => {

    const status = document.getElementById("save-push-status");
    const input = document.getElementById("register-code");
    const code = input.value;

    if (!code) {
      status.textContent = "비밀번호를 입력해 주세요.";
      return;
    }

    status.textContent = "⏳ 등록 중...";

    try {

      const registration = await navigator.serviceWorker.ready;

      const subscription =
        await registration.pushManager.getSubscription();

      if (!subscription) {
        throw new Error("먼저 휴대폰 푸시 구독을 생성해 주세요.");
      }

      const response = await fetch(
        "https://nurse-alert-checker.youn6628.workers.dev/push/register",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            code: code,
            subscription: subscription.toJSON()
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "등록 실패");
      }

      status.textContent = "✅ 휴대폰 서버 등록 성공!";

    } catch (error) {

      status.textContent = "❌ " + error.message;

    } finally {

      input.value = "";

    }

  });
</script>
  <hr>

<h2>☁️ 서버 푸시 알림 테스트</h2>

<p>등록용 비밀번호를 입력한 후 테스트해 주세요.</p>

<button id="remote-push-test"
  style="padding:15px; font-size:18px;
         background:#16a34a; color:white;
         border:0; border-radius:10px;">
  🔔 서버에서 알림 보내기
</button>

<p id="remote-push-status"></p>

<script>
document.getElementById("remote-push-test")
  .addEventListener("click", async () => {

    const status =
      document.getElementById("remote-push-status");

    const input =
      document.getElementById("register-code");

    const code = input.value;

    if (!code) {
      status.textContent = "❌ 등록용 비밀번호를 입력해 주세요.";
      return;
    }

    status.textContent = "⏳ 서버에서 알림 전송 중...";

    try {

      const response = await fetch(
        "https://nurse-alert-checker.youn6628.workers.dev/push/test",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            code: code
          })
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error ||
          "푸시 서비스 오류: " + result.pushStatus
        );
      }

      status.textContent =
        "✅ 서버 전송 요청 성공! 알림창을 확인해 주세요.";

    } catch (error) {

      status.textContent =
        "❌ 전송 실패: " + error.message;

    } finally {

      input.value = "";

    }

  });
</script>
</body>
</html>
