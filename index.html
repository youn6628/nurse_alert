<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Nurse Alert</title>
</head>

<body style="background:#f0f5ff;
             text-align:center;
             font-family:sans-serif;
             padding:30px;">

  <h1 style="color:#2563eb; font-size:32px;">🏥 Nurse Alert</h1>
  <h3>간호사 채용공고 알림</h3>

  <p>
  📍 검색 반경:
  <select id="radius" onchange="saveRadius()">
    <option value="10">10km</option>
    <option value="20" selected>20km</option>
    <option value="30">30km</option>
    <option value="40">40km</option>
  </select>
</p>

<script>
  const radius = document.getElementById("radius");

  radius.value = localStorage.getItem("radius") || "20";

  function saveRadius() {
    localStorage.setItem("radius", radius.value);
  }
</script>
  <p>📅 근무조건: 평일 주 2일</p>

  <hr>

  <h2>🔔 신규 채용공고</h2>

  <p>아직 등록된 공고가 없습니다.</p>

</body>
</html>
