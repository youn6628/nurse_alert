<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Nurse Alert</title>
</head>

<body style="background:#f0f5ff;
             text-align:center;
             font-family:sans-serif;
             padding:30px;">

  <h1 style="color:#2563eb; font-size:32px;">🏥 Nurse Alert</h1>
  <h3>간호사 채용공고 알림</h3>

  <p>
  📍 검색 반경:
  <select id="radius" onchange="saveRadius()">
    <option value="10">10km</option>
    <option value="20" selected>20km</option>
    <option value="30">30km</option>
    <option value="40">40km</option>
  </select>
</p>

<script>
  const radius = document.getElementById("radius");

  radius.value = localStorage.getItem("radius") || "20";

  function saveRadius() {
  const oldRadius = Number(localStorage.getItem("radius") || 20);
  const newRadius = Number(radius.value);

  if (newRadius > oldRadius) {
    localStorage.setItem("oldRadius", oldRadius);
  } else {
    localStorage.removeItem("oldRadius");
  }

  localStorage.setItem("radius", newRadius);
}
</script>
  <p>📅 근무조건: 평일 주 2일</p>

  <hr>

  <h2>🔔 신규 채용공고</h2>

  <div id="job-list"></div>

<script>
  // 테스트용 가상 채용공고
  const jobs = [
    { name: "가상 A병원", distance: 8, days: "월/수" },
    { name: "가상 B병원", distance: 18, days: "화/목" },
    { name: "가상 C병원", distance: 25, days: "월/금" },
    { name: "가상 D병원", distance: 35, days: "수/목" }
  ];

  function showJobs() {
    const radius = Number(document.getElementById("radius").value);
    const jobList = document.getElementById("job-list");

    const filteredJobs = jobs.filter(job => job.distance <= radius);

    jobList.innerHTML = filteredJobs.map(job => `
      <div style="
        background:white;
        padding:15px;
        margin:10px 0;
        border-radius:10px;
        text-align:left;
      ">
        <h3>🏥 ${job.name}</h3>
        <p>📍 집에서 ${job.distance}km</p>
        <p>📅 근무요일: ${job.days}</p>
      </div>
    `).join("");
  }

  document.getElementById("radius").addEventListener("change", showJobs);

  showJobs();
</script>

</body>
</html>
