<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Nurse Alert</title>
</head>

<body style="background:#f0f5ff;
             text-align:center;
             font-family:sans-serif;
             padding:30px;">

  <h1 style="color:#2563eb; font-size:32px;">🏥 Nurse Alert</h1>
  <h3>간호사 채용공고 알림</h3>

  <p>
  📍 검색 반경:
  <select id="radius" onchange="saveRadius()">
    <option value="10">10km</option>
    <option value="20" selected>20km</option>
    <option value="30">30km</option>
    <option value="40">40km</option>
  </select>
</p>

<script>
  const radius = document.getElementById("radius");

  radius.value = localStorage.getItem("radius") || "20";

  function saveRadius() {
  const oldRadius = Number(localStorage.getItem("radius") || 20);
  const newRadius = Number(radius.value);

  if (newRadius > oldRadius) {

    // 이전 검색 반경 저장
    localStorage.setItem("oldRadius", oldRadius);

    // 검색 반경을 확장한 시간 저장
    localStorage.setItem("expandedAt", new Date().toISOString());

  } else if (newRadius < oldRadius) {

    localStorage.removeItem("oldRadius");
    localStorage.removeItem("expandedAt");

  }

  localStorage.setItem("radius", newRadius);
}
</script>
  <p>📅 근무조건: 평일 주 2일</p>

  <hr>

  <h2>🔔 신규 채용공고</h2>

  <div id="job-list"></div>

<script>
  // 테스트용 가상 채용공고
  const jobs = [
  { name: "가상 A병원", distance: 8, days: "월/수" },
  { name: "가상 B병원", distance: 18, days: "화/목" },
  { name: "가상 C병원", distance: 25, days: "월/금" },
  { name: "가상 D병원", distance: 35, days: "수/목" },
  { name: "가상 E병원", distance: 12, days: "토/일" },
  { name: "가상 F병원", distance: 15, days: "월/수/금" }
];
  function isWeekdayTwice(days) {
  const workdays = days.split("/");
  const weekdays = ["월", "화", "수", "목", "금"];

  return (
    workdays.length === 2 &&
    workdays[0] !== workdays[1] &&
    workdays.every(day => weekdays.includes(day))
  );
}
  function showJobs() {
    const radius = Number(document.getElementById("radius").value);
    const jobList = document.getElementById("job-list");

    const filteredJobs = jobs.filter(job =>
  job.distance <= radius &&
  isWeekdayTwice(job.days)
);

    jobList.innerHTML = filteredJobs.map(job => `
      <div style="
        background:white;
        padding:15px;
        margin:10px 0;
        border-radius:10px;
        text-align:left;
      ">
        <h3>🏥 ${job.name}</h3>
        <p>📍 집에서 ${job.distance}km</p>
        <p>📅 근무요일: ${job.days}</p>
      </div>
    `).join("");
  }

  document.getElementById("radius").addEventListener("change", showJobs);

  showJobs();
</script>
<div id="expanded-jobs"></div>

<script>
function showExpandedJobs() {
  const current = Number(document.getElementById("radius").value);
  const previous = Number(localStorage.getItem("oldRadius") || current);

  const missedJobs = jobs.filter(job =>
  job.distance > previous &&
  job.distance <= current &&
  isWeekdayTwice(job.days)
);

  const section = document.getElementById("expanded-jobs");

  if (missedJobs.length === 0) {
    section.innerHTML = "";
    return;
  }

  section.innerHTML = `
    <details style="
      background:#fff3cd;
      padding:15px;
      border-radius:12px;
      margin-top:20px;
      text-align:left;
    ">
      <summary>
        📂 검색 범위 확장으로 발견한 공고
        (${missedJobs.length}건)
      </summary>

      ${missedJobs.map(job => `
        <hr>
        <p>🏥 ${job.name}</p>
        <p>📍 ${job.distance}km</p>
        <p>📅 ${job.days}</p>
      `).join("")}
    </details>
  `;
}

document.getElementById("radius")
  .addEventListener("change", showExpandedJobs);

showExpandedJobs();
</script>

<hr>

<h2>☁️ Cloudflare DB 채용공고</h2>

<div id="server-jobs">
  채용공고를 불러오는 중...
</div>

<script>
async function loadServerJobs() {

  const container = document.getElementById("server-jobs");

  try {

    const radius = document.getElementById("radius").value;

const response = await fetch(
  `https://nurse-alert-checker.youn6628.workers.dev/?radius=${radius}`
);

    if (!response.ok) {
      throw new Error("서버 응답 오류: " + response.status);
    }

    const jobs = await response.json();

    container.innerHTML = "";

    if (jobs.length === 0) {
      container.textContent = "저장된 공고가 없습니다.";
      return;
    }

    jobs.forEach(job => {

      const card = document.createElement("div");

      card.style.cssText = `
        background:white;
        padding:15px;
        margin:10px 0;
        border-radius:10px;
        text-align:left;
      `;

      const hospital = document.createElement("h3");
      hospital.textContent = "🏥 " + job.hospital;

      const title = document.createElement("p");
      title.textContent = job.title;

      const schedule = document.createElement("p");
      schedule.textContent = "📅 " + job.schedule_text;

      const link = document.createElement("a");
      link.textContent = "🔗 채용공고 바로가기";

      if (job.url && /^https?:\/\//i.test(job.url)) {
        link.href = job.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }

      card.append(hospital, title, schedule, link);
      container.appendChild(card);

    });

  } catch (error) {

    container.textContent =
      "❌ 채용공고를 불러오지 못했습니다: " + error.message;

  }

}

loadServerJobs();

document.getElementById("radius")
  .addEventListener("change", loadServerJobs);

</script>

</body>
</html>
