<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Nurse Alert 키 생성</title>
</head>

<body style="font-family:sans-serif; padding:20px;">

  <h2>🔑 Nurse Alert 인증키 생성</h2>

  <button onclick="generateKeys()">
    인증키 생성하기
  </button>

  <h3>🔓 Public Key</h3>
  <textarea id="publicKey"
            rows="5"
            style="width:100%;box-sizing:border-box;"
            readonly></textarea>

  <h3>🔒 Private Key</h3>
  <textarea id="privateKey"
            rows="5"
            style="width:100%;box-sizing:border-box;"
            readonly></textarea>

  <script>
    function base64url(buffer) {
      return btoa(
        String.fromCharCode(...new Uint8Array(buffer))
      )
      .replace(/\+/g, "-")
      .replace(/\//g, "_")
      .replace(/=+$/, "");
    }

    async function generateKeys() {
      const keys = await crypto.subtle.generateKey(
        {
          name: "ECDSA",
          namedCurve: "P-256"
        },
        true,
        ["sign", "verify"]
      );

      const pub = await crypto.subtle.exportKey(
        "raw", keys.publicKey
      );

      const priv = await crypto.subtle.exportKey(
        "jwk", keys.privateKey
      );

      document.getElementById("publicKey").value =
        base64url(pub);

      document.getElementById("privateKey").value =
        priv.d;
    }
  </script>

</body>
</html>
